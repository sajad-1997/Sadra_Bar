<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>افزودن اطلاعات خودرو راننده</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f1f1f1;
            padding: 20px;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #1976d2;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>
<div class="form-box">
    <h2 style="text-align:center;">فرم ثبت اطلاعات خودرو</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ذخیره و ثبت نهایی</button>
        <button type="button" onclick="parsePlate()">نمایش پلاک</button>


    </form>
</div>

<div id="result" style="margin-top:15px;text-align:center;"></div>

{##}
{#<h2>ورود شماره پلاک خودرو</h2>#}
{#<p>مثال: <strong>12الف34567</strong></p>#}
{##}
{#<input type="text" id="plateInput" placeholder="شماره پلاک را وارد کنید">#}
{#<button onclick="parsePlate()">نمایش</button>#}
{##}
{#<div class="result" id="result"></div>#}

<script>
    document.addEventListener('DOMContentLoaded', function () {

        /* ===== کنترل مجوز خوراک دام ===== */
        const animalLicenseSelect = document.getElementById('id_animal_license');
        const veterinaryCodeInput = document.getElementById('id_veterinary_code');

        function toggleVeterinaryCode() {
            if (animalLicenseSelect.value === 'Yes') {
                veterinaryCodeInput.disabled = false;
            } else {
                veterinaryCodeInput.disabled = true;
                veterinaryCodeInput.value = '';
            }
        }

        if (animalLicenseSelect && veterinaryCodeInput) {
            animalLicenseSelect.addEventListener('change', toggleVeterinaryCode);
            toggleVeterinaryCode(); // اجرای اولیه
        }

        /* ===== نمایش پلاک ===== */
        window.parsePlate = function () {
            const part2 = document.getElementById('id_license_plate_two_digit').value.trim();
            const letter = document.getElementById('id_license_plate_alphabet').value.trim();
            const part3 = document.getElementById('id_license_plate_three_digit').value.trim();
            const series = document.getElementById('id_license_plate_series').value.trim();

            const plateRegexLetter = /^[اآبپتثجچحخدذرزسشصضطظعغفقکگلمنوهی]$/;

            if (
                /^\d{2}$/.test(part2) &&
                plateRegexLetter.test(letter) &&
                /^\d{3}$/.test(part3) &&
                /^\d{2}$/.test(series)
            ) {
                document.getElementById('result').innerHTML = `
                <div style="
                    display:inline-block;
                    padding:10px 15px;
                    border:2px solid #000;
                    border-radius:6px;
                    background:#fefefe;
                    font-weight:bold;
                    font-size:22px;
                    letter-spacing:3px;">
                    ${part2} ${letter} ${part3}
                    <span style="margin-right:10px;font-size:16px;color:#0d47a1;">
                        ایران ${series}
                    </span>
                </div>
            `;
            } else {
                document.getElementById('result').innerHTML =
                    "<p style='color:red'>فرمت پلاک معتبر نیست</p>";
            }
        };

    });
</script>

</body>
</html>
