{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش اطلاعات راننده</title>
    <link rel="stylesheet" href="{% static 'issuance/css/persian-datepicker.css' %}">
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f1f1f1;
            padding: 20px;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #1976d2;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>
<h3>ویرایش / ثبت راننده</h3>

<form id="driver-form">
    <input type="hidden" id="driver-id" name="id">

    <div class="mb-3">
        <label>نام و نام خانوادگی:</label>
        <input type="text" id="driver-input" name="name" class="form-control">
        <div id="driver-results" class="list-group"
             style="display:none; position:absolute; z-index:1000; width:100%;"></div>
                     <div class="error-msg" id="error_name"></div>

    </div>
    <br>
    <br>
    <br>


    <div class="mb-3">
        <label>کد ملی:</label>
        <input type="text" id="driver-national-id" name="national_id" class="form-control">
                <div class="error-msg" id="error_national_id"></div>

    </div>

    <div class="mb-3">
        <label>شهر محل سکونت:</label>
        <input type="text" id="driver-residence" name="residence" class="form-control">
    </div>

    <div class="mb-3">
        <label>نام پدر:</label>
        <input type="text" id="driver-father-name" name="father_name" class="form-control">
    </div>

    <div class="mb-3">
        <label>تاریخ تولد:</label>
        <input type="text" id="driver-birth-date" name="birth_date" class="date-picker form-control">
    </div>

    <div class="mb-3">
        <label>تاریخ صدور گواهینامه:</label>
        <input type="text" id="driver-certificate-date" name="certificate_date" class="date-picker form-control">
    </div>

    <div class="mb-3">
        <label>شماره گواهینامه:</label>
        <input type="text" id="driver-certificate" name="certificate" class="form-control">
        <div class="error-msg" id="error_certificate"></div>

    </div>

    <div class="mb-3">
        <label>شماره تلفن راننده:</label>
        <input type="text" id="driver-phone" name="phone" class="form-control">
        <div class="error-msg" id="error_phone"></div>

    </div>

    <div class="mb-3">
        <label>شماره تلفن دوم:</label>
        <input type="text" id="driver-phone2" name="phone2" class="form-control">
    </div>

    <div class="mb-3">
        <label>آدرس محل سکونت:</label>
        <input type="text" id="driver-address" name="address" class="form-control">
    </div>

    <div class="mb-3">
        <label>شماره هوشمند راننده:</label>
        <input type="text" id="driver-smart-card" name="driver_smart_card" class="form-control" >
    </div>

    <div class="mb-3">
        <label>شماره بیمه شخص ثالث:</label>
        <input type="text" id="driver-insurance-policy-number" name="insurance_policy_number" class="form-control" >
    </div>

    <div class="mb-3">
        <label>تاریخ پایان اعتبار بیمه شخص ثالث:</label>
        <input type="text" id="driver-insurance-policy-expiry" name="insurance_policy_expiry" class="form-control" >
    </div>

    <button type="submit" class="btn btn-success">ذخیره</button>
</form>

<p id="msg"></p>


<!-- اسکریپت‌ها -->
    <!-- jQuery (الزامی) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Persian Date (هسته محاسبات شمسی) -->
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>

    <!-- Persian Datepicker -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
        <script>
        $(document).ready(function () {

            /* ===== انتخاب تاریخ شمسی ===== */
            $('.date-picker').persianDatepicker({
                format: 'YYYY/MM/DD',
                autoClose: true,
                initialValue: false,
                initialValueType: 'persian',
                observer: true,
                calendar: {
                    persian: {
                        locale: 'fa',
                        leapYearMode: 'algorithmic'
                    }
                },
                toolbox: {
                    todayButton: {
                        enabled: true,
                        text: {fa: 'امروز'}
                    }
                },
                timePicker: {
                    enabled: false
                }
            });

            /* ===== انتخاب ساعت (HH:MM:SS با اعداد فارسی) ===== */
            $('.time-picker').persianDatepicker({
                format: 'HH:mm:ss',
                autoClose: true,
                initialValue: false,
                onlyTimePicker: true,
                timePicker: {
                    enabled: true,
                    second: {
                        enabled: true
                    },
                    meridiem: {
                        enabled: false
                    }
                }
            });

        });
    </script>

<script>
    $(document).ready(function () {
        let selectedIndex = -1;

        // جستجو
        $("#driver-input").on("keyup", function (e) {
            let query = $(this).val()

            // اگر خالی شد → همه فیلدها رو پاک کن
            if (query.length === 0) {
                clearForm("");
                $("#driver-results").empty().hide();
                selectedIndex = -1;
                return;
            }

            // کنترل کلیدها
            if (e.keyCode === 38) {
                if (selectedIndex > 0) selectedIndex--;
                highlightItem();
                return;
            }
            if (e.keyCode === 40) {
                if (selectedIndex < $("#driver-results .list-group-item").length - 1) selectedIndex++;
                highlightItem();
                return;
            }
            if (e.keyCode === 13) {
                e.preventDefault();
                let selected = $("#driver-results .list-group-item").eq(selectedIndex);
                if (selected.length) {
                    chooseItem(selected);
                }
                return;
            }

            $.ajax({
                url: "{% url 'issuance:search:search_driver' %}",
                data: {q: query},
                success: function (data) {
                    let html = "";
                    if (data.results.length > 0) {
                        data.results.forEach(function (item) {
                            html += `<button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-id="${item.id}"
                                    data-name="${item.name}"
                                    data-national_id="${item.national_id || ''}"
                                    data-residence="${item.residence || ''}"
                                    data-father_name="${item.father_name || ''}"
                                    data-birth_date="${item.birth_date || ''}"
                                    data-certificate_date="${item.certificate_date || ''}"
                                    data-certificate="${item.certificate || ''}"
                                    data-phone="${item.phone || ''}"
                                    data-phone2="${item.phone2 || ''}"
                                    data-address="${item.address || ''}"
                                    data-plate_number="${item.plate_number || ''}"
                                    data-driver_smart_card="${item.driver_smart_card || ''}"
                                    data-insurance_policy_number="${item.insurance_policy_number || ''}"
                                    data-insurance_policy_expiry="${item.insurance_policy_expiry || ''}">
                                    <strong>${item.name}</strong>
                                    ${item.phone ? " - " + item.phone : ""}
                                 </button>`;
                        });
                    } else {
                        clearForm(query); // نتیجه‌ای نبود → فرم خالی شه و فقط نام بمونه
                        html = `<div class="list-group-item">نتیجه‌ای یافت نشد</div>`;
                    }
                    $("#driver-results").html(html).show();
                    selectedIndex = -1;
                }
            });
        });

        function highlightItem() {
            $("#driver-results .list-group-item").removeClass("active");
            if (selectedIndex >= 0) {
                $("#driver-results .list-group-item").eq(selectedIndex).addClass("active");
            }
        }

        function chooseItem(item) {
            $("#driver-id").val(item.data("id"));
            $("#driver-input").val(item.data("name"));
            $("#driver-national-id").val(item.data("national_id"));
            $("#driver-residence").val(item.data("residence"));
            $("#driver-father-name").val(item.data("father_name"));
            $("#driver-birth-date").val(item.data("birth_date"));
            $("#driver-certificate-date").val(item.data("certificate_date"));
            $("#driver-certificate").val(item.data("certificate"));
            $("#driver-phone").val(item.data("phone"));
            $("#driver-phone2").val(item.data("phone2"));
            $("#driver-address").val(item.data("address"));
            $("#driver-plate").val(item.data("plate"));
            $("#driver-driver-smart-card").val(item.data("driver_smart_card"));
            $("#driver-insurance-policy-number").val(item.data("insurance_policy_number"));
            $("#driver-insurance-policy-expiry").val(item.data("insurance_policy_expiry"));

            $("#driver-results").empty().hide();
        }

        // فرم خالی‌ساز
        function clearForm(name = "") {
            $("#driver-id").val("");
            $("#driver-input").val(name);
            $("#driver-national-id").val("");
            $("#driver-residence").val("");
            $("#driver-father-name").val("");
            $("#driver-birth-date").val("");
            $("#driver-certificate-date").val("");
            $("#driver-certificate").val("");
            $("#driver-phone").val("");
            $("#driver-phone2").val("");
            $("#driver-address").val("");
            $("#driver-driver-smart-card").val("");
            $("#driver-insurance-policy-number").val("");
            $("#driver-insurance-policy-expiry").val("");
        }

        // انتخاب با کلیک
        $(document).on("click", "#driver-results .list-group-item", function () {
            chooseItem($(this));
        });

        // ذخیره اطلاعات
        $("#driver-form").submit(function (e) {
        e.preventDefault();

         $(".form-control").removeClass("is-invalid");

        $.ajax({
        url: "{% url 'issuance:crud:save_driver' %}",
        type: "POST",
        data: $(this).serialize(),
        headers: {"X-CSRFToken": "{{ csrf_token }}"},
        success: function (resp) {

            if (resp.success) {
                window.location.href = resp.redirect;   // ← بازگشت به صفحه قبل
                return;
            }

            // اگر خطا داشت
            $("#msg").text(resp.error);

            if (resp.field) {
                $(`[name="${resp.field}"]`).addClass("is-invalid");
            }
        },

        error: function () {
            $("#msg").text("مشکلی در ارتباط با سرور پیش آمد");
        }
    });
        });

    });
</script>


</body>
</html>
